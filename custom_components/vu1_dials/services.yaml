set_dial_value:
  target:
    entity:
      integration: vu1_dials
  fields:
    value:
      required: true
      example: 75
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_dial_backlight:
  target:
    entity:
      integration: vu1_dials
  fields:
    red:
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      required: true
      example: 25
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      required: true
      example: 75
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_dial_name:
  target:
    entity:
      integration: vu1_dials
  fields:
    name:
      required: true
      example: "CPU Usage"
      selector:
        text:

set_dial_image:
  target:
    entity:
      integration: vu1_dials
  fields:
    media_content_id:
      required: true
      selector:
        media:
          accept:
            - "image/*"

reload_dial:
  target:
    entity:
      integration: vu1_dials

configure_dial:
  target:
    entity:
      integration: vu1_dials
  fields:
    bound_entity:
      required: false
      example: sensor.cpu_temperature
      selector:
        entity:
          domain:
            - sensor
            - input_number
            - number
            - counter
    value_min:
      required: false
      example: 30
      selector:
        number:
          mode: box
          step: any
    value_max:
      required: false
      example: 90
      selector:
        number:
          mode: box
          step: any
    backlight_color:
      required: false
      example: "[255, 128, 0]"
      selector:
        color_rgb:
    dial_easing:
      required: false
      example: smooth
      selector:
        select:
          translation_key: easing_preset
          options:
            - responsive
            - balanced
            - smooth
    backlight_easing:
      required: false
      example: smooth
      selector:
        select:
          translation_key: easing_preset
          options:
            - responsive
            - balanced
            - smooth
    update_mode:
      required: false
      example: automatic
      selector:
        select:
          translation_key: update_mode
          options:
            - automatic
            - manual
